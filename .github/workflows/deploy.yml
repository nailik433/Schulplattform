name: Deploy auf den Server

# Spielt neuen Code automatisch auf dem Server ein, sobald etwas nach `main`
# gelangt (z. B. ein gemergter Pull Request). Zusätzlich lässt sich der Deploy
# in GitHub unter "Actions" von Hand starten ("Run workflow").
#
# Voraussetzung: vier Secrets im Repo hinterlegen (Settings -> Secrets and
# variables -> Actions). Wie, steht in docs/AUTO-DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Verhindert, dass zwei Deploys gleichzeitig laufen.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update per SSH auf dem Server ausführen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "→ Neuesten Stand von main holen ..."
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            echo "→ Container neu bauen und starten ..."
            docker compose up -d --build
            echo "✓ Deploy abgeschlossen."

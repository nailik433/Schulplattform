{% extends "base.html" %}

{% block title %}{{ lesson.title }}{% endblock %}

{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <h1 style="font-size:1.4rem;">{{ lesson.title }}</h1>
    <a class="btn btn-secondary btn-small" href="{% url 'schools:student_space' token=student.access_code %}">← Zurück</a>
</div>

<div class="card" style="padding:0;overflow:hidden;">
    <iframe id="lesson-frame" src="{% url 'lessons:lesson_content' lesson.pk %}"
            sandbox="allow-scripts allow-forms allow-popups"
            style="width:100%;height:78vh;border:0;display:block;background:#fff;"></iframe>
</div>

<script>
(function(){
    var reportUrl = "{% url 'lessons:lesson_report' lesson.pk %}";
    window.addEventListener('message', function(e){
        var d = e.data;
        if(!d || d.type !== 'lesson_result') return;
        try {
            fetch(reportUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    score: d.score,
                    max: (d.max !== undefined ? d.max : d.max_score),
                    completed: d.completed !== false,
                    detail: d.detail || {}
                })
            });
        } catch (err) { /* ignore */ }
    });
})();
</script>
{% endblock %}

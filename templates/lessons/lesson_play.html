{% load static %}<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">
    <title>{{ lesson.title }} – Schulplattform</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230071e3'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E📚%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="player">
<header class="player-bar">
    <a class="btn btn-secondary btn-small" href="{% url 'schools:student_home' %}">← Zurück</a>
    <span class="player-title">{{ lesson.title }}</span>
    <span class="player-user">{{ student.label }}</span>
</header>

<iframe id="lesson-frame" class="player-frame" title="{{ lesson.title }}"
        src="{% url 'lessons:lesson_content' lesson.pk %}"
        sandbox="allow-scripts allow-forms allow-popups" allowfullscreen></iframe>

<script>
(function(){
    var reportUrl = "{% url 'lessons:lesson_report' lesson.pk %}";
    var csrf = "{{ csrf_token }}";
    var frame = document.getElementById('lesson-frame');
    window.addEventListener('message', function(e){
        // Only accept results from our own sandboxed frame.
        if(e.source !== frame.contentWindow) return;
        var d = e.data;
        if(!d || d.type !== 'lesson_result') return;
        try {
            fetch(reportUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
                body: JSON.stringify({
                    score: d.score,
                    max: (d.max !== undefined ? d.max : d.max_score),
                    completed: d.completed !== false,
                    detail: d.detail || {}
                })
            });
        } catch (err) { /* ignore */ }
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kurze Störung – Schulplattform</title>
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; background:#f5f5f7; color:#1d1d1f; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
        .card { background:#fff; border:1px solid #e8e8ed; border-radius:24px; padding:40px 32px; max-width:440px; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.06); }
        .code { font-size:3rem; font-weight:700; color:#d2d2d7; }
        h1 { font-size:1.6rem; margin:6px 0 10px; letter-spacing:-.02em; }
        p { color:#6e6e73; line-height:1.5; }
        a { display:inline-block; margin-top:10px; background:#0071e3; color:#fff; text-decoration:none; padding:12px 20px; border-radius:12px; font-weight:500; }
        @media (prefers-color-scheme: dark) {
            body { background:#000; color:#f5f5f7; }
            .card { background:#1c1c1e; border-color:#2a2a2d; }
            .code { color:#3a3a3c; } p { color:#98989d; } a { background:#2997ff; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>Kurze Störung</h1>
        <p>Da ist etwas schiefgelaufen. Bitte versuche es in einem Moment noch einmal – nichts ist verloren gegangen.</p>
        <a href="/">Zur Startseite</a>
    </div>
</body>
</html>

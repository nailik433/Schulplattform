{% extends "base.html" %}

{% block title %}Passwort zurücksetzen{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h1>Passwort zurücksetzen</h1>
    <p class="subtitle">
        Gib deine E-Mail-Adresse ein. Wir senden dir einen Link zum Festlegen
        eines neuen Passworts.
    </p>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn">Link anfordern</button>
            <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Zurück</a>
        </div>
    </form>
</div>
{% endblock %}

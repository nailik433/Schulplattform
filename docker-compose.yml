# Production stack for a single rented server (e.g. a Hostinger VPS).
#
#   1. Point your domain's DNS A-record at the server's IP.
#   2. Copy .env.example to .env and fill in real values
#      (set DOMAIN and LETSENCRYPT_EMAIL below via that .env too).
#   3. Run:  docker compose up -d --build
#
# Caddy automatically obtains and renews a free HTTPS certificate for DOMAIN.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-schulplattform}
      POSTGRES_USER: ${DJANGO_DB_USER:-schulplattform}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?DJANGO_DB_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-schulplattform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name.
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN muss in .env gesetzt sein}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL muss in .env gesetzt sein}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
